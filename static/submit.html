<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NullVault - Submit a Secret</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0d12;
    color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #12151c;
    border: 1px solid #232732;
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: #8b93a1;
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #b5bcc9;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0b0d12;
    border: 1px solid #2a2f3a;
    border-radius: 8px;
    color: #e6e8eb;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #4a90e2;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    background: #4a90e2;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #2a3a4d;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 16px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.ok {
    display: block;
    background: rgba(46, 160, 67, 0.15);
    color: #4fce6e;
    border: 1px solid rgba(46, 160, 67, 0.35);
  }
  .msg.err {
    display: block;
    background: rgba(224, 62, 62, 0.15);
    color: #f27272;
    border: 1px solid rgba(224, 62, 62, 0.35);
  }
  .hint {
    font-size: 12px;
    color: #6b7280;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Submit a secret</h1>
  <p class="sub">Paste the access token you were given, then enter the secret you want to hand off. This value is encrypted immediately and cannot be viewed back through this page.</p>

  <form id="submitForm">
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off" required>

    <label for="project">Project</label>
    <input id="project" type="text" autocomplete="off" required placeholder="e.g. acme-app">

    <label for="name">Secret name</label>
    <input id="name" type="text" autocomplete="off" required placeholder="e.g. stripe-api-key">

    <label for="value">Secret value</label>
    <input id="value" type="password" autocomplete="off" required>
    <p class="hint">Right after submitting, close this tab. Nothing you enter is stored in this browser.</p>

    <button id="submitBtn" type="submit">Submit secret</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script>
  const form = document.getElementById("submitForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Submitting...";

    const token = document.getElementById("token").value.trim();
    const project = document.getElementById("project").value.trim();
    const name = document.getElementById("name").value.trim();
    const value = document.getElementById("value").value;

    try {
      const res = await fetch("/secrets/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({ project, name, value }),
      });

      if (res.status === 201) {
        msg.className = "msg ok";
        msg.textContent = "Secret submitted successfully. You can close this tab now.";
        form.reset();
      } else if (res.status === 401) {
        msg.className = "msg err";
        msg.textContent = "That token is invalid or has expired. Ask for a new link.";
      } else if (res.status === 403) {
        msg.className = "msg err";
        msg.textContent = "This token is not authorized for that project. Check the project name.";
      } else if (res.status === 404) {
        msg.className = "msg err";
        msg.textContent = "That project doesn't exist. Check the project name.";
      } else if (res.status === 400) {
        msg.className = "msg err";
        msg.textContent = "A secret with that name already exists. Use a different name.";
      } else {
        const body = await res.json().catch(() => ({}));
        msg.className = "msg err";
        msg.textContent = "Something went wrong: " + (body.detail || res.status);
      }
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "Network error. Please try again.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit secret";
    }
  });
</script>
</body>
</html>
